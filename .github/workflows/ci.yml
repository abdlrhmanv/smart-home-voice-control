name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit/integration tests
        env:
          # Avoid accidental serial / mic side effects in CI
          ARDUINO_PORT: ""
          ALLOW_OFFLINE_CONTROL: "1"
        run: |
          pytest -q \
            --cov=core --cov=adapters --cov=ml/src --cov=api --cov=services \
            --cov=ai --cov=utils --cov=audio \
            --cov-report=term-missing \
            --cov-fail-under=65
